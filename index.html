<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Свалка: от тележки до завода</title>
  <!-- ?v= — номер версии: увеличивать при изменениях, чтобы браузер не брал старые файлы из кэша -->
  <link rel="stylesheet" href="css/style.css?v=202611131710">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="bar" id="bar">
      <div class="money"><span class="coin"></span><span id="money">0</span><span class="sep"></span><span class="star-ic">★</span><span id="stars">0</span></div>
      <div class="dayinfo"><span id="day-label"></span><span id="day-timer" class="timer"></span></div>
      <div class="actions">
        <button id="btn-sound" class="icon-btn" aria-label="sound"></button>
        <button id="btn-pause" class="icon-btn" aria-label="pause"></button>
      </div>
      <div class="goals invisible" id="goals">
        <div class="quota">
          <div class="goal-top"><span id="quota-label"></span><span id="pile-label"></span></div>
          <div class="progress"><div id="quota-progress"></div></div>
        </div>
        <div class="overflow"><span id="overflow-label"></span><div id="overflow-pips" class="pips"></div></div>
      </div>
    </div>
    <div id="hint" class="hint hidden"></div>
  </div>

  <div id="modal-root"></div>
  <div id="loading"><div class="spinner"></div></div>

  <!-- Площадка: 'local' (разработка), 'pikabu' или 'yandex'. Подставляется сборкой tools/build.py -->
  <script>window.GAME_PLATFORM = 'pikabu';</script>
  <script async src="https://games.pikabu.ru/sdk/sdk.js"></script>
  <script src="js/i18n.js?v=202611131710"></script>
  <script src="js/sdk.js?v=202611131710"></script>
  <script src="js/audio.js?v=202611131710"></script>
  <script src="js/draw.js?v=202611131710"></script>
  <script src="js/game.js?v=202611131710"></script>
</body>
</html>
